name: tak-app
services:
  caddy:
    image: caddy:latest
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile.${ENVIRONMENT}:/etc/caddy/Caddyfile
      - ${PLAYTAK_UI_DIST}:/srv/www/dist
      - caddy_data:/data
      - caddy_config:/config
      - ./certs:/certs
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      TAK_HTTP_API_PORT: ${TAK_HTTP_API_PORT}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      - MP_SEND_API_AUTH_ACCEPT_ANY=true

  tak_server:
    image: tak-server:latest
    restart: unless-stopped
    ports:
      - '${TAK_HTTP_API_PORT}:${TAK_HTTP_API_PORT}'
    environment:
      TAK_HTTP_API_PORT: ${TAK_HTTP_API_PORT}
      TAK_HOST: ${TAK_HOST}
      TAK_JWT_SECRET: ${TAK_JWT_SECRET}
      TAK_BOT_REGISTRY_PATH: ${TAK_BOT_REGISTRY_PATH}
      PROFILE_PICTURE_STORAGE_PATH: ${PROFILE_PICTURE_STORAGE_PATH}
      LOG_FILE_DIRECTORY: ${LOG_FILE_DIRECTORY}
      LOG_FILE_NAME: ${LOG_FILE_NAME}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${GOOGLE_SERVICE_ACCOUNT_KEY}
      GOOGLE_SHEETS_EVENTS_SPREADSHEET_ID: ${GOOGLE_SHEETS_EVENTS_SPREADSHEET_ID}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      TAK_EMAIL_URL: ${TAK_EMAIL_URL}
      TAK_EMAIL_FROM: ${TAK_EMAIL_FROM}
      ENVIRONMENT: ${ENVIRONMENT}
    depends_on:
      - postgres
    profiles:
      - production
    volumes:
      - profile_picture_storage:${PROFILE_PICTURE_STORAGE_PATH}

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  profile_picture_storage:
