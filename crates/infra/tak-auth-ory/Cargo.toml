[package]
edition = "2024"
name    = "tak-auth-ory"
version = "0.1.0"

[dependencies]
async-trait           = "0.1.89"
chrono                = "0.4.42"
dotenvy               = "0.15.7"
jsonwebtoken          = { version = "10.2.0", features = [ "rust_crypto" ] }
moka                  = { version = "0.12.10", features = [ "sync" ] }
ory-kratos-client     = "25.4.0"
reqwest               = { version = "0.12.28", features = [ "json" ] }
serde                 = { version = "1.0.219", features = [ "derive" ] }
serde_json            = "1.0.143"
tak-server-api        = { path = "../../api/tak-server-api" }
tak-server-app        = { path = "../../tak-server-app" }
tracing               = "0.1.44"
