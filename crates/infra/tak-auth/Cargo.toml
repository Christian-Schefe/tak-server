[package]
edition.workspace = true
name              = "tak-auth"
version           = "0.1.0"

[dependencies]
argon2         = "0.6.0"
async-trait    = "0.1.89"
chrono         = "0.4.42"
jsonwebtoken   = { version = "10.2.0", features = [ "rust_crypto" ] }
moka           = { version = "0.12.10", features = [ "sync" ] }
serde          = { version = "1.0.219", features = [ "derive" ] }
serde_json     = "1.0.143"
tak-server-api = { path = "../../api/tak-server-api" }
tak-server-app = { path = "../../tak-server-app" }
tracing        = "0.1.44"
