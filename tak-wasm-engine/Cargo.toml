[package]
edition = "2024"
name    = "tak-wasm-engine"
version = "0.1.0"

[lib]
crate-type = [ "cdylib" ]

[dependencies]
async-channel = "2.5.0"
console_error_panic_hook = "0.1.7"
futures = "0.3.32"
getrandom = { version = "0.2", features = [ "js" ] }
gloo-timers = { version = "0.3.0", features = [ "futures" ] }
js-sys = "0.3.91"
rand = { version = "0.8", features = [ "getrandom" ] }
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"
tak-core = { path = "../tak-core" }
tak-server-api-contract = { path = "../api/tak-server-api-contract" }
tiltak = { path = "../../tiltak", default-features = false }
uuid = { version = "1.18.1", features = [ "js", "serde", "v4" ] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.64"
web-sys = { version = "0.3.91", features = [
    "DedicatedWorkerGlobalScope",
    "Performance",
    "WorkerGlobalScope",
    "console",
] }
