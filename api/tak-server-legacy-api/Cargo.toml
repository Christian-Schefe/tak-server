[package]
edition = "2024"
name    = "tak-server-legacy-api"
version = "0.1.0"

[dependencies]
async-trait           = "0.1.89"
axum                  = { version = "0.8.4", features = [ "macros", "ws" ] }
bcrypt                = "0.17.1"
dashmap               = "6.1.0"
futures               = "0.3.31"
futures-util          = "0.3.31"
log                   = "0.4.28"
passwords             = "3.1.16"
serde                 = { version = "1.0.219", features = [ "derive" ] }
serde_json            = "1.0.143"
tak-core              = { path = "../../tak-core" }
tak-player-connection = { path = "../../infra/tak-player-connection" }
tak-server-app        = { path = "../../tak-server-app" }
tokio                 = { version = "1.47.1", features = [ "full" ] }
tokio-util            = { version = "0.7.16", features = [ "full" ] }
unordered-pair        = "0.2.5"
uuid                  = { version = "1.18.1", features = [ "v4" ] }
