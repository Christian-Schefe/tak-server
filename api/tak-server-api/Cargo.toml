[package]
edition = "2024"
name    = "tak-server-api"
version = "0.1.0"

[dependencies]
async-trait           = "0.1.89"
axum                  = { version = "0.8.4", features = [ "macros", "multipart", "ws" ] }
axum-extra            = { version = "0.12.5", features = [ "typed-header" ] }
chrono                = { version = "0.4.42", features = [ "serde" ] }
country-code-enum     = "0.2.0"
dashmap               = "6.1.0"
futures               = "0.3.31"
image                 = "0.25.9"
log                   = "0.4.28"
serde                 = { version = "1.0.219", features = [ "derive" ] }
serde_json            = "1.0.143"
tak-core              = { path = "../../tak-core" }
tak-player-connection = { path = "../../infra/tak-player-connection" }
tak-server-app        = { path = "../../tak-server-app" }
tokio                 = { version = "1.47.1", features = [ "full" ] }
tokio-util            = { version = "0.7.16", features = [ "full" ] }
uuid                  = { version = "1.18.1", features = [ "serde", "v4" ] }
