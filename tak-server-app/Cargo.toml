[package]
edition = "2024"
name    = "tak-server-app"
version = "0.1.0"

[dependencies]
async-trait          = "0.1.89"
bytes                = "1.11.1"
chrono               = "0.4.42"
country-code-enum    = "0.2.0"
dashmap              = "6.1.0"
futures              = "0.3.31"
image                = "0.25.9"
log                  = "0.4.28"
more-concurrent-maps = { path = "../more-concurrent-maps" }
rand                 = "0.9.2"
rustrict             = "0.7.36"
tak-core             = { path = "../tak-core" }
tokio                = { version = "1.47.1", features = [ "full" ] }
tokio-util           = { version = "0.7.16", features = [ "full" ] }
unordered-pair       = "0.2.5"
uuid                 = { version = "1.18.1", features = [ "v4" ] }
