[package]
edition      = "2024"
name         = "tak-persistence-sea-orm-migrations"
publish      = false
rust-version = "1.85.0"
version      = "0.1.0"

[dependencies]
async-trait = "0.1.89"
sea-orm = { version = "2.0.0-rc", features = [
    "entity-registry",
    "macros",
    "runtime-tokio-native-tls",
    "schema-sync",
    "sqlx-mysql",
] }
sea-orm-migration = { version = "2.0.0-rc", features = [
    "runtime-tokio-native-tls",
    "sqlx-mysql",
] }
tak-persistence-sea-orm-entities = { path = "../tak-persistence-sea-orm-entities" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
